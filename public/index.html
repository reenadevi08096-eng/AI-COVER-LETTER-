<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cover Letter Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans flex items-center justify-center">

  <div class="max-w-4xl w-full bg-white p-6 rounded-xl shadow-lg border border-gray-200">
    <header class="border-b pb-4 mb-6 w-full text-center">
      <h1 class="text-2xl font-bold text-gray-800">AI Cover Letter Generator</h1>
    </header>

    <div class="grid md:grid-cols-2 gap-8">
      
      <!-- Form Component -->
      <form id="coverLetterForm" class="space-y-4 bg-gray-50 p-5 rounded-lg border border-gray-200">
        <div>
          <label for="candidateName" class="block text-sm font-medium text-gray-700">Candidate Name</label>
          <input type="text" id="candidateName" required placeholder="e.g. Reena Yadav"
            class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none">
        </div>

        <div>
          <label for="jobRole" class="block text-sm font-medium text-gray-700">Target Job Role</label>
          <input type="text" id="jobRole" required placeholder="e.g. Software Developer"
            class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none">
        </div>

        <div>
          <label for="targetCompany" class="block text-sm font-medium text-gray-700">Target Company</label>
          <input type="text" id="targetCompany" required placeholder="e.g. Microsoft"
            class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none">
        </div>

        <div>
          <label for="keySkills" class="block text-sm font-medium text-gray-700">Key Skills & Expertise</label>
          <textarea id="keySkills" rows="3" required placeholder="e.g. C, Java"
            class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none"></textarea>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow disabled:bg-gray-400">
          Generate Cover Letter
        </button>
      </form>

      <!-- Output Component -->
      <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-semibold text-gray-800 mb-4">Generated Cover Letter</h2>
          <div id="outputContainer" class="min-h-[260px] p-4 bg-white rounded-lg border border-gray-300 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">
            <span class="text-gray-400 italic">Fill the details and click generate...</span>
          </div>
          <button type="button" id="copyBtn" class="mt-4 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg transition">

  Copy to Clipboard
</button>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
