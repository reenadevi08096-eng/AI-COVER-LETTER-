<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cover Letter Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">AI Cover Letter Generator</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Input Form -->
      <form id="coverLetterForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Job Title</label>
          <input type="text" id="jobTitle" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Web Developer Intern">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Company Name</label>
          <input type="text" id="companyName" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Prodesk IT">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Key Skills & Experience</label>
          <textarea id="keySkills" rows="4" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. React, Node.js, Express, JavaScript, Tailwind CSS"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-md transition duration-200">
          Generate Cover Letter
        </button>
      </form>

      <!-- Output Section -->
      <div class="flex flex-col">
        <h2 class="text-lg font-semibold mb-2 text-gray-700">Generated Cover Letter</h2>
        <textarea id="output" readonly class="w-full flex-grow p-3 border border-gray-300 rounded-md bg-gray-50 text-gray-800 resize-none h-64 md:h-auto" placeholder="Your generated cover letter will appear here..."></textarea>
        
        <button id="copyBtn" class="mt-3 bg-gray-700 hover:bg-gray-800 text-white font-medium py-2 px-4 rounded-md transition duration-200">
          Copy to Clipboard
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
